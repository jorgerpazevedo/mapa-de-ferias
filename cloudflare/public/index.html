<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Férias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F5F7FB; --surface:#FFFFFF; --surface-2:#EDF1FA;
    --ink:#14181F; --ink-soft:#5B6472; --ink-faint:#93A0B4;
    --accent:#3B82F6; --accent-ink:#1D4ED8; --accent-bg:#E7F0FE;
    --moss:#16A34A; --moss-bg:#E7F8EC;
    --rose:#DC2626; --rose-bg:#FDEAEA;
    --pending:#D97706; --pending-bg:#FEF3E0;
    --sand:#E3E8F0;
    --shadow:0 1px 2px rgba(20,24,31,.05), 0 12px 28px -16px rgba(20,24,31,.16);
    --radius:14px;
    --font-display:'Work Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-body:'Work Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1420; --surface:#151C2C; --surface-2:#1C2436;
      --ink:#EDF1F8; --ink-soft:#A7B0C0; --ink-faint:#6C7688;
      --accent:#5B93F5; --accent-ink:#BFD7FF; --accent-bg:#1E2C46;
      --moss:#4ADE80; --moss-bg:#123322;
      --rose:#F87171; --rose-bg:#3A1717;
      --pending:#FBBF24; --pending-bg:#3A2A0C;
      --sand:#232C40;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1420; --surface:#151C2C; --surface-2:#1C2436;
    --ink:#EDF1F8; --ink-soft:#A7B0C0; --ink-faint:#6C7688;
    --accent:#5B93F5; --accent-ink:#BFD7FF; --accent-bg:#1E2C46;
    --moss:#4ADE80; --moss-bg:#123322;
    --rose:#F87171; --rose-bg:#3A1717;
    --pending:#FBBF24; --pending-bg:#3A2A0C;
    --sand:#232C40;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  input,select{font-family:inherit; font-size:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-bg);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  .hidden{display:none !important;}

  #login-view{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow:hidden;
    background-image: radial-gradient(var(--sand) 1px, transparent 1px);
    background-size:26px 26px; background-position:-4px -4px;
  }
  #login-view::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(600px 400px at 20% 15%, var(--paper) 10%, transparent 60%),
      radial-gradient(700px 500px at 85% 90%, var(--paper) 5%, transparent 55%);
    pointer-events:none;
  }
  .login-card{
    position:relative; z-index:1; width:100%; max-width:380px;
    background:var(--surface); border:1px solid var(--sand);
    border-radius:20px; padding:36px 32px 30px; box-shadow:var(--shadow);
  }
  .login-mark{width:42px;height:42px;border-radius:11px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:18px;}
  .login-card h1{font-size:26px; margin-bottom:4px;}
  .login-sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:26px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase;}
  .field input, .field select{width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--sand); background:var(--paper); color:var(--ink);}
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:10px; border:1px solid transparent; font-weight:600; font-size:14.5px; transition:transform .08s ease, opacity .15s ease; text-decoration:none;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{opacity:.92;}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-ghost{background:transparent; border-color:var(--sand); color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
  .login-error{background:var(--rose-bg); color:var(--rose); font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:14px; display:none;}
  .login-hint{margin-top:20px; font-size:12px; color:var(--ink-faint); line-height:1.6;}

  #app-view{min-height:100vh; display:flex; flex-direction:column;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:15px; flex-shrink:0;}
  .brand-name{font-family:var(--font-display); font-weight:600; font-size:16.5px;}

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--sand);}
  .hamburger-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--sand); background:var(--paper); color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .hamburger-btn svg, .drawer-close svg{width:19px; height:19px;}
  .hamburger-btn:hover{background:var(--surface-2);}
  .topbar-spacer{flex:1;}
  .topbar-avatar{width:34px; height:34px; border-radius:50%; background:var(--accent-bg); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; border:none; font-family:inherit;}

  .drawer-backdrop{position:fixed; inset:0; background:rgba(15,20,14,.4); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .drawer-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; left:0; bottom:0; width:300px; max-width:86vw; background:var(--surface); border-right:1px solid var(--sand); z-index:41; transform:translateX(-100%); transition:transform .25s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; box-shadow:var(--shadow);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px; border-bottom:1px solid var(--sand);}
  .drawer-head-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .drawer-close{width:30px; height:30px; border-radius:8px; border:1px solid var(--sand); background:var(--paper); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
  .drawer-close:hover{background:var(--surface-2);}
  .drawer-profile{display:flex; align-items:center; gap:12px;}
  .drawer-avatar{width:46px; height:46px; border-radius:50%; background:var(--accent-bg); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0;}
  .drawer-profile-name{font-weight:600; font-size:15px;}
  .drawer-profile-role{font-size:12px; color:var(--ink-faint);}
  .drawer-balance-chip{display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:3px 9px; border-radius:999px; background:var(--accent-bg); color:var(--accent-ink); font-size:11.5px; font-weight:600; font-family:var(--font-mono);}

  .drawer-body{flex:1; overflow-y:auto; padding:10px 12px 18px;}
  .drawer-section-label{display:flex; align-items:center; gap:8px; padding:16px 10px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700;}
  .drawer-section-label .rh-badge{background:var(--accent-bg); color:var(--accent-ink); font-size:9.5px; padding:1px 6px; border-radius:999px; letter-spacing:0; text-transform:none; font-weight:700;}
  .drawer-section.rh{background:var(--accent-bg); border-radius:14px; padding:2px 0 8px; margin:6px 0;}
  .drawer-section.rh .drawer-section-label{color:var(--accent-ink); opacity:.8;}
  .drawer-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 10px; border-radius:10px; background:transparent; border:none; color:var(--ink-soft); font-weight:500; font-size:14px; margin-bottom:2px;}
  .drawer-item svg{width:19px; height:19px; flex-shrink:0;}
  .drawer-item:hover{background:var(--surface-2); color:var(--ink);}
  .drawer-item.active{background:var(--accent); color:#fff;}
  .drawer-section.rh .drawer-item:hover{background:rgba(255,255,255,.35);}
  .drawer-section.rh .drawer-item.active{background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow);}
  .drawer-item .item-badge{margin-left:auto; background:var(--rose); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; font-family:var(--font-mono);}
  .drawer-foot{padding:14px 18px; border-top:1px solid var(--sand);}

  .main{flex:1; min-width:0; padding:32px 40px 60px; max-width:1080px; width:100%; margin:0 auto;}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
  .page-head h2{font-size:24px;}
  .page-head p{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:28px;}
  .stat-card{background:var(--surface); border:1px solid var(--sand); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
  .stat-num{font-family:var(--font-display); font-size:32px; font-weight:800; line-height:1; letter-spacing:-.01em;}
  .stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}

  .panel{background:var(--surface); border:1px solid var(--sand); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:24px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--sand); gap:12px; flex-wrap:wrap;}
  .panel-head h3{font-size:16px;}
  .panel-body{padding:6px 20px 18px;}
  .panel-body.pad{padding:20px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; padding:10px 10px; border-bottom:1px solid var(--sand);}
  tbody td{padding:12px 10px; border-bottom:1px solid var(--sand); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .emp-name{font-weight:600;}
  .emp-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .bal{font-family:var(--font-mono); font-size:13px;}
  .bal .low{color:var(--rose); font-weight:600;}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .table-wrap{overflow-x:auto;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600;}
  .chip-ferias{background:var(--accent-bg); color:var(--accent-ink);}
  .chip-baixa{background:var(--moss-bg); color:var(--moss);}
  .chip-pendente{background:var(--pending-bg); color:var(--pending);}
  .chip-aprovado{background:var(--moss-bg); color:var(--moss);}
  .chip-rejeitado{background:var(--rose-bg); color:var(--rose);}
  .chip-neutral{background:var(--surface-2); color:var(--ink-faint);}
  .chip-row{display:flex; gap:6px; flex-wrap:wrap;}

  .nav-badge{margin-left:auto; background:var(--rose); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; line-height:1.5; font-family:var(--font-mono);}
  .panel-attention{border-color:var(--pending);}
  .panel-attention .panel-head{border-bottom-color:var(--pending-bg);}
  .req-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 10px; border-bottom:1px solid var(--sand); flex-wrap:wrap;}
  .req-row:last-child{border-bottom:none;}
  .req-actions{display:flex; gap:8px; flex-shrink:0;}
  .btn-approve{background:var(--moss-bg); color:var(--moss);}
  .btn-reject{background:var(--rose-bg); color:var(--rose);}
  .pending-note{font-size:11.5px; color:var(--pending); font-weight:600; margin-top:2px;}

  .ring-wrap{position:relative; width:56px; height:56px; flex-shrink:0;}
  .ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--surface-2);}
  .ring-fill{fill:none; stroke-linecap:round;}
  .ring-fill.accent{stroke:var(--accent);}
  .ring-fill.moss{stroke:var(--moss);}
  .ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--ink);}

  .cal-nav{display:flex; gap:4px;}
  .cal-nav button{width:26px; height:26px; border-radius:7px; border:1px solid var(--sand); background:var(--paper); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
  .cal-nav button:hover{background:var(--surface-2);}
  .cal-month{text-align:center; font-weight:600; font-size:14px; margin-bottom:12px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:10px; text-transform:uppercase; letter-spacing:.02em; color:var(--ink-faint); font-weight:600; padding-bottom:2px;}
  .cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:12px; font-family:var(--font-mono); color:var(--ink-soft);}
  .cal-day.empty{visibility:hidden;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--ink); font-weight:700; color:var(--ink);}
  .cal-day.ferias{background:var(--accent-bg); color:var(--accent-ink); font-weight:600;}
  .cal-day.baixa{background:var(--moss-bg); color:var(--moss); font-weight:600;}
  .cal-day.pendente{background:var(--pending-bg); color:var(--pending); font-weight:600; box-shadow:inset 0 0 0 1.5px var(--pending);}
  .cal-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:11.5px; color:var(--ink-soft);}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .cal-dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}

  .empty{padding:28px 10px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding:52px 24px;}
  .empty-state-icon{width:48px; height:48px; border-radius:14px; background:var(--surface-2); color:var(--ink-faint); display:flex; align-items:center; justify-content:center;}
  .empty-state-icon svg{width:22px; height:22px;}
  .empty-state h4{font-family:var(--font-display); font-size:16px; font-weight:600; margin:0;}
  .empty-state p{font-size:13px; color:var(--ink-soft); max-width:320px; margin:0; line-height:1.55;}

  .list-item{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 10px; border-bottom:1px solid var(--sand);}
  .list-item:last-child{border-bottom:none;}
  .list-item-main{display:flex; align-items:center; gap:12px; min-width:0;}
  .avatar{width:34px;height:34px;border-radius:50%; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0; object-fit:cover;}
  .li-name{font-weight:600; font-size:13.5px;}
  .li-sub{font-size:12px; color:var(--ink-faint);}

  .profile-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px;}
  @media (max-width:820px){ .profile-grid{grid-template-columns:1fr;} .main{padding:24px 18px 50px;} }

  @media (min-width:960px){
    #app-view{flex-direction:row; align-items:stretch;}
    .topbar{display:none;}
    .drawer{position:sticky; top:0; align-self:flex-start; height:100vh; transform:none !important; box-shadow:none; flex-shrink:0;}
    .drawer-backdrop{display:none !important;}
    .drawer-close{display:none;}
    .main{padding-top:32px;}
  }

  .balance-card{padding:20px;}
  .balance-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--sand);}
  .balance-row:last-child{border-bottom:none;}
  .balance-title{font-weight:600; font-size:14px;}
  .balance-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .balance-figure{font-family:var(--font-mono); font-size:20px; font-weight:600; text-align:right;}
  .balance-figure small{display:block; font-size:11px; font-weight:500; color:var(--ink-faint); font-family:var(--font-body);}

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(15,20,14,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{width:100%; max-width:440px; background:var(--surface); border-radius:18px; border:1px solid var(--sand); box-shadow:var(--shadow); padding:26px 26px 22px; max-height:88vh; overflow-y:auto;}
  .modal h3{font-size:18px; margin-bottom:4px;}
  .modal-sub{font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .form-error{background:var(--rose-bg); color:var(--rose); font-size:13px; padding:9px 11px; border-radius:9px; margin-bottom:12px; display:none;}
  .form-note{font-size:12px; color:var(--ink-faint); margin-top:4px;}
  .segment{display:flex; gap:8px; margin-bottom:14px;}
  .segment button{flex:1; padding:9px; border-radius:9px; border:1px solid var(--sand); background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:13.5px;}
  .segment button.active{background:var(--accent-bg); color:var(--accent-ink); border-color:var(--accent-bg);}
  .segment button.active.baixa{background:var(--moss-bg); color:var(--moss); border-color:var(--moss-bg);}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .icon-btn{width:30px;height:30px;border-radius:8px; border:1px solid var(--sand); background:var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px;}

  .search-input-wrap{position:relative; max-width:280px; width:100%;}
  .search-input-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint);}
  .search-input-wrap input{width:100%; padding:9px 12px 9px 34px; border-radius:9px; border:1px solid var(--sand); background:var(--paper); color:var(--ink); font-size:13.5px;}
  .search-input-wrap input:focus{border-color:var(--accent);}
  .status-detail{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}

  .breadcrumb{font-size:12.5px; color:var(--ink-faint); margin-bottom:10px;}
  .breadcrumb button{background:none; border:none; color:var(--ink-soft); font-weight:600; cursor:pointer; padding:0; font-size:inherit; font-family:inherit;}
  .breadcrumb button:hover{color:var(--accent-ink); text-decoration:underline;}
  .avatar-lg{width:64px; height:64px; border-radius:50%; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:22px; flex-shrink:0; object-fit:cover;}
  .avatar-upload-wrap{position:relative; flex-shrink:0;}
  .avatar-upload-btn{position:absolute; bottom:-2px; right:-2px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; border:2px solid var(--surface); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; padding:0;}
  .avatar-upload-btn:hover{opacity:.9;}
  .comm-link{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px; border:1px solid var(--sand); color:var(--ink); margin-bottom:8px;}
  .comm-link:last-child{margin-bottom:0;}
  .comm-link:hover{background:var(--surface-2);}
  .comm-link svg{width:18px; height:18px; flex-shrink:0; color:var(--ink-soft);}
  .comm-link-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
  .comm-link-value{font-weight:600; font-size:13.5px;}

  .tag-chip{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--sand);}
  .tag-chip svg{width:10px; height:10px;}
  .tag-chip.active{background:var(--accent-bg); color:var(--accent-ink); border-color:var(--accent-bg);}
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tag-filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .tag-filter-row button{background:none; border:none; padding:0; cursor:pointer;}

  .activity-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--sand);}
  .activity-item:last-child{border-bottom:none;}
  .activity-icon{width:34px; height:34px; border-radius:10px; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .activity-icon svg{width:16px; height:16px;}
  .activity-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .activity-type{font-weight:600; font-size:13.5px;}
  .activity-meta{font-size:11.5px; color:var(--ink-faint);}
  .activity-details{font-size:13.5px; color:var(--ink); margin-top:3px; white-space:pre-wrap;}
  .activity-badges{display:flex; gap:6px; margin-top:6px;}
  .activity-remove{margin-left:auto; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:12px; flex-shrink:0;}
  .activity-remove:hover{color:var(--rose);}

  .kanban-board{display:grid; grid-template-columns:repeat(3,minmax(240px,1fr)); gap:16px; align-items:start; overflow-x:auto;}
  .kanban-col{background:var(--surface); border:1px solid var(--sand); border-radius:var(--radius); box-shadow:var(--shadow); min-width:240px;}
  .kanban-col-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--sand);}
  .kanban-col-head h3{font-size:14px;}
  .kanban-count{background:var(--surface-2); color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px; padding:2px 8px; border-radius:999px;}
  .kanban-cards{padding:12px; display:flex; flex-direction:column; gap:10px; min-height:60px;}
  .kanban-card{background:var(--paper); border:1px solid var(--sand); border-radius:10px; padding:12px;}
  .kanban-card-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .profile-header{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:24px;}
  .profile-header-info h2{margin-bottom:4px;}
  .profile-header-actions{display:flex; gap:10px; margin-left:auto; flex-wrap:wrap;}
  .kv-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--sand); gap:12px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-label{font-size:12.5px; color:var(--ink-faint);}
  .kv-value{font-weight:600; font-size:13.5px; text-align:right;}

  .wallchart-scroll{overflow-x:auto; padding:16px 20px 20px;}
  .wallchart{min-width:max-content;}
  .wallchart-row{display:flex; align-items:stretch; border-bottom:1px solid var(--sand);}
  .wallchart-row:last-child{border-bottom:none;}
  .wallchart-namecol{position:sticky; left:0; z-index:2; width:190px; flex-shrink:0; background:var(--surface); display:flex; align-items:center; gap:10px; padding:10px 14px 10px 0;}
  .wallchart-head .wallchart-namecol{background:var(--surface);}
  .wallchart-days{display:grid; grid-auto-rows:1fr; position:relative; padding:4px 0; flex:1 1 auto;}
  .wallchart-daylabel{grid-row:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); padding:4px 0;}
  .wallchart-daylabel.weekend{background:var(--surface-2);}
  .wallchart-daylabel .dow{font-size:9px; text-transform:uppercase; color:var(--ink-faint); opacity:.7;}
  .wallchart-cell{grid-row:1; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--font-mono); color:var(--ink-faint);}
  .wallchart-cell.weekend{background:var(--surface-2);}
  .wallchart-cell.today{box-shadow:inset 0 0 0 1.5px var(--ink); border-radius:6px; color:var(--ink); font-weight:700;}
  .wallchart-bar{grid-row:1; align-self:center; height:22px; margin:0 2px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; overflow:hidden; white-space:nowrap; padding:0 4px;}
  .wallchart-bar.ferias{background:var(--accent); color:#fff;}
  .wallchart-bar.baixa{background:var(--moss); color:#fff;}
  .wallchart-bar.pendente{background:var(--pending-bg); color:var(--pending); box-shadow:inset 0 0 0 1.5px var(--pending); border-style:dashed;}
  .wallchart-legend{display:flex; gap:14px; flex-wrap:wrap; padding:0 20px 16px; font-size:11.5px; color:var(--ink-soft);}
  .wallchart-legend span{display:inline-flex; align-items:center; gap:5px;}
  .table-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 20px; border-top:1px solid var(--sand); font-size:12.5px; color:var(--ink-faint); flex-wrap:wrap;}
  .table-foot .pager{display:flex; align-items:center; gap:6px;}
  .icon-btn:hover{background:var(--surface-2);}
</style>
</head>
<body>

<div id="root">
  <div id="login-view">
    <div class="login-card">
      <div class="login-mark">🌴</div>
      <h1>Mapa de Férias</h1>
      <p class="login-sub">Inicia sessão para consultar o teu saldo ou marcar ausências.</p>
      <div class="login-error" id="login-error"></div>
      <form id="login-form">
        <div class="field"><label for="login-user">Utilizador</label><input id="login-user" type="text" autocomplete="username" required></div>
        <div class="field"><label for="login-pass">Palavra-passe</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <div class="login-hint">Administrador: <strong class="mono">admin</strong> / <strong class="mono">admin</strong> · Funcionário (exemplo): <strong class="mono">user</strong> / <strong class="mono">user</strong></div>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <div class="topbar">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menu"></button>
      <div class="brand"><div class="brand-mark">🌴</div><div class="brand-name">Mapa de Férias</div></div>
      <div class="topbar-spacer"></div>
      <button class="topbar-avatar" id="topbar-avatar" title="Abrir menu">—</button>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <div class="drawer-head-top">
          <div class="brand"><div class="brand-mark">🌴</div><div class="brand-name">Mapa de Férias</div></div>
          <button class="drawer-close" id="drawer-close" aria-label="Fechar menu"></button>
        </div>
        <div class="drawer-profile">
          <div class="drawer-avatar" id="drawer-avatar">—</div>
          <div>
            <div class="drawer-profile-name" id="drawer-name">—</div>
            <div class="drawer-profile-role" id="drawer-role">—</div>
            <div class="drawer-balance-chip" id="drawer-balance">— dias restantes</div>
          </div>
        </div>
      </div>
      <nav class="drawer-body" id="drawer-body"></nav>
      <div class="drawer-foot">
        <button class="btn btn-ghost btn-block btn-sm" id="logout-btn">Sair</button>
      </div>
    </div>

    <div class="main" id="main"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var state = null;
  var currentView = 'home';
  var calMonth = new Date().getMonth();
  var calYear = new Date().getFullYear();
  var teamSearch = '';
  var teamPage = 0;
  var TEAM_PAGE_SIZE = 8;
  var wcMonth = new Date().getMonth();
  var wcYear = new Date().getFullYear();
  var viewingEmployeeId = null;
  var teamListSearch = '';
  var teamListPage = 0;
  var teamListTagFilter = '';
  var employeeActivitiesCache = {};

  function todayIso(){ return new Date().toISOString().slice(0,10); }
  function fmt(iso){ if(!iso) return '—'; var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function parseIso(iso){ var p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function calendarDaysCount(s,e){ return Math.round((parseIso(e)-parseIso(s))/86400000)+1; }
  function businessDaysCount(s,e){
    var sd=parseIso(s), ed=parseIso(e); if(ed<sd) return 0;
    var count=0, d=new Date(sd);
    while(d<=ed){ var dow=d.getDay(); if(dow!==0 && dow!==6) count++; d.setDate(d.getDate()+1); }
    return count;
  }
  function initials(name){ var p=(name||'?').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[p.length-1]||'')[0]||''); }
  function employeeById(id){ return (state && state.employees ? state.employees : []).find(function(e){ return e.id===id; }); }
  function avatarHtml(person, cls){
    cls = cls || 'avatar';
    if(person && person.photo) return '<img class="'+cls+'" src="'+esc(person.photo)+'" alt="">';
    return '<div class="'+cls+'">'+esc(initials(person?person.name:'?'))+'</div>';
  }
  function onlyDigits(s){ return (s||'').replace(/\D/g,''); }

  function resizePhotoFile(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('Não foi possível ler o ficheiro.')); };
      reader.onload = function(){
        img.onerror = function(){ reject(new Error('Ficheiro de imagem inválido.')); };
        img.onload = function(){
          var size = 200;
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          var side = Math.min(img.width, img.height);
          var sx = (img.width-side)/2, sy = (img.height-side)/2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function uploadPhotoFor(empId, file){
    try{
      var dataUrl = await resizePhotoFile(file);
      var isSelf = state.me.id===empId;
      await api(isSelf ? 'me/photo' : 'employees/'+empId+'/photo', {method:'PUT', body: JSON.stringify({photo: dataUrl})});
      await loadState();
      showToast('Foto atualizada.');
    }catch(e){ showToast(e.message || 'Não foi possível carregar a foto.'); }
  }

  async function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    var res = await fetch('/api/'+path, Object.assign({}, opts, {headers: headers}));
    var data = {};
    try { data = await res.json(); } catch(e){}
    if(!res.ok) throw new Error(data.error || ('Erro '+res.status));
    return data;
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  async function loadState(){
    state = await api('state');
    render();
  }

  function ringSvg(pct, cls){
    pct = Math.max(0, Math.min(100, pct));
    var r=22, c=2*Math.PI*r, dash=c*pct/100;
    return '<div class="ring-wrap"><svg viewBox="0 0 56 56">'+
      '<circle class="ring-track" cx="28" cy="28" r="'+r+'" stroke-width="6"></circle>'+
      '<circle class="ring-fill '+cls+'" cx="28" cy="28" r="'+r+'" stroke-width="6" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+(c-dash).toFixed(2)+'"></circle>'+
      '</svg><div class="ring-label">'+Math.round(pct)+'%</div></div>';
  }

  var MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var DOW_NAMES = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  function isoFromYMD(y,m,d){ function pad(n){return (n<10?'0':'')+n;} return y+'-'+pad(m+1)+'-'+pad(d); }
  function leavesOnDate(dateIso, employeeId){
    return state.leaves.filter(function(l){
      if(l.status==='rejeitado') return false;
      if(employeeId && l.employeeId!==employeeId) return false;
      return parseIso(l.start) <= parseIso(dateIso) && parseIso(dateIso) <= parseIso(l.end);
    });
  }
  function calendarWidget(employeeId){
    var y=calYear, m=calMonth;
    var first = new Date(y,m,1);
    var startDow = (first.getDay()+6)%7;
    var daysInMonth = new Date(y,m+1,0).getDate();
    var todayStr = todayIso();

    var html = '<div class="panel"><div class="panel-head"><h3>Calendário</h3><div class="cal-nav"><button type="button" id="cal-prev">‹</button><button type="button" id="cal-next">›</button></div></div><div class="panel-body pad">';
    html += '<div class="cal-month">'+MONTH_NAMES[m]+' '+y+'</div><div class="cal-grid">';
    DOW_NAMES.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });
    for(var i=0;i<startDow;i++) html += '<div class="cal-day empty"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var iso = isoFromYMD(y,m,d);
      var dayLeaves = leavesOnDate(iso, employeeId);
      var cls = 'cal-day';
      if(iso===todayStr) cls += ' today';
      if(dayLeaves.length){
        var hasFerias = dayLeaves.some(function(l){return l.type==='ferias' && l.status==='aprovado';});
        var hasBaixa = dayLeaves.some(function(l){return l.type==='baixa' && l.status==='aprovado';});
        var hasPend = dayLeaves.some(function(l){return l.status==='pendente';});
        if(hasFerias) cls += ' ferias'; else if(hasBaixa) cls += ' baixa'; else if(hasPend) cls += ' pendente';
      }
      var titleAttr = dayLeaves.length ? esc(dayLeaves.map(function(l){return l.employeeName;}).join(', ')) : '';
      html += '<div class="'+cls+'" title="'+titleAttr+'">'+d+'</div>';
    }
    html += '</div><div class="cal-legend"><span><span class="cal-dot" style="background:var(--accent)"></span>Férias</span><span><span class="cal-dot" style="background:var(--moss)"></span>Baixa</span><span><span class="cal-dot" style="background:var(--pending)"></span>Pendente</span></div></div></div>';
    return html;
  }

  var CONTRACT_TYPES = [
    {value:'efetivo', label:'Efetivo (sem termo)'},
    {value:'termo_certo', label:'Termo certo'},
    {value:'termo_incerto', label:'Termo incerto'},
    {value:'prestacao_servicos', label:'Prestação de serviços'},
    {value:'estagio', label:'Estágio'}
  ];
  function contractTypeLabel(v){
    var f = CONTRACT_TYPES.find(function(c){return c.value===v;});
    return f ? f.label : 'Efetivo (sem termo)';
  }

  var ACTIVITY_TYPE_LABELS = {chamada:'Chamada', reuniao:'Reunião', email:'Email', evento:'Evento', nota:'Nota', outro:'Outro'};
  var ACTIVITY_ICONS = {chamada:'phoneCall', reuniao:'users2', email:'mail', evento:'calendar', nota:'paperclip', outro:'help'};
  var ACTIVITY_STATUS_LABELS = {concluido:'Concluído', agendado:'Agendado', pendente:'Pendente'};
  var ACTIVITY_IMPACT_LABELS = {positivo:'Positivo', neutro:'Neutro', atencao:'Precisa de atenção'};
  function statusPill(text){ return '<span class="chip chip-neutral">'+esc(text)+'</span>'; }
  function impactPill(impact){
    var cls = impact==='positivo' ? 'chip-aprovado' : impact==='atencao' ? 'chip-rejeitado' : 'chip-neutral';
    return '<span class="chip '+cls+'">'+esc(ACTIVITY_IMPACT_LABELS[impact]||impact)+'</span>';
  }
  function fmtDateTime(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    var pad = function(n){ return (n<10?'0':'')+n; };
    return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function chipLabel(type){ return type==='ferias' ? 'Férias' : 'Baixa'; }
  function chip(type){ return type==='ferias' ? '<span class="chip chip-ferias">Férias</span>' : '<span class="chip chip-baixa">Baixa</span>'; }
  function statusChip(status){
    if(status==='pendente') return '<span class="chip chip-pendente">Pendente</span>';
    if(status==='rejeitado') return '<span class="chip chip-rejeitado">Rejeitado</span>';
    return '<span class="chip chip-aprovado">Aprovado</span>';
  }

  function employeeCurrentStatus(empId){
    var rows = state.leaves.filter(function(l){return l.employeeId===empId;});
    var today = todayIso();
    var pending = rows.filter(function(l){return l.status==='pendente';}).sort(function(a,b){return a.start<b.start?-1:1;})[0];
    if(pending) return {chip:'<span class="chip chip-pendente">Pendente</span>', detail: chipLabel(pending.type)+' · '+fmt(pending.start)+' – '+fmt(pending.end)};
    var current = rows.find(function(l){return l.status==='aprovado' && l.start<=today && today<=l.end;});
    if(current) return {chip:'<span class="chip chip-aprovado">Em curso</span>', detail: chipLabel(current.type)+' até '+fmt(current.end)};
    var future = rows.filter(function(l){return l.status==='aprovado' && l.start>today;}).sort(function(a,b){return a.start<b.start?-1:1;})[0];
    if(future) return {chip:'<span class="chip chip-aprovado">Aprovado</span>', detail: fmt(future.start)+' – '+fmt(future.end)};
    return {chip:'<span class="chip chip-neutral">Sem pedido ativo</span>', detail:'—'};
  }

  function tagRow(tags){
    if(!tags || !tags.length) return '';
    return '<div class="tag-row">'+tags.map(function(t){ return '<span class="tag-chip">'+icon('tag')+' '+esc(t)+'</span>'; }).join('')+'</div>';
  }

  function employeeStatusBadge(e){
    var today = todayIso();
    if(e.contractEnd && e.contractEnd<today) return '<span class="chip chip-rejeitado">Contrato terminado</span>';
    var onLeave = state.leaves.find(function(l){return l.employeeId===e.id && l.status==='aprovado' && l.start<=today && today<=l.end;});
    if(onLeave) return '<span class="chip chip-pendente">Em '+(onLeave.type==='ferias'?'férias':'baixa')+'</span>';
    return '<span class="chip chip-aprovado">Ativo</span>';
  }

  function teamStatusPanel(){
    var q = teamSearch.trim().toLowerCase();
    var filtered = state.employees.filter(function(e){ return !q || e.name.toLowerCase().indexOf(q)!==-1; });
    var totalPages = Math.max(1, Math.ceil(filtered.length / TEAM_PAGE_SIZE));
    if(teamPage>=totalPages) teamPage = totalPages-1;
    if(teamPage<0) teamPage = 0;
    var pageRows = filtered.slice(teamPage*TEAM_PAGE_SIZE, teamPage*TEAM_PAGE_SIZE+TEAM_PAGE_SIZE);

    var html = '<div class="panel"><div class="panel-head"><h3>Colaboradores</h3>'+
      '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">'+
      '<div class="search-input-wrap">'+icon('search')+'<input type="text" id="team-search-input" placeholder="Pesquisar por nome…" value="'+esc(teamSearch)+'"></div>'+
      '<button class="btn btn-primary btn-sm" id="dash-add-emp">+ Novo colaborador</button>'+
      '</div></div><div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Estado do pedido</th><th></th></tr></thead><tbody>';
    if(pageRows.length===0){
      html += '<tr><td colspan="3"><div class="empty">Nenhum colaborador encontrado.</div></td></tr>';
    } else {
      pageRows.forEach(function(e){
        var st = employeeCurrentStatus(e.id);
        var isPending = st.chip.indexOf('chip-pendente')!==-1;
        var pendingLeave = isPending ? state.leaves.filter(function(l){return l.employeeId===e.id && l.status==='pendente';}).sort(function(a,b){return a.start<b.start?-1:1;})[0] : null;
        html += '<tr><td><div class="list-item-main">'+avatarHtml(e)+'<div><div class="li-name">'+esc(e.name)+'</div><div class="li-sub">'+esc(e.email||e.phone||'@'+e.username)+'</div></div></div></td>'+
          '<td>'+st.chip+'<div class="status-detail">'+esc(st.detail)+'</div></td>'+
          '<td><div class="row-actions">'+
          (pendingLeave ? '<button class="btn btn-sm btn-reject" data-reject="'+pendingLeave.id+'">Rejeitar</button><button class="btn btn-sm btn-approve" data-approve="'+pendingLeave.id+'">Aprovar</button>' : '<button class="btn btn-ghost btn-sm" data-view-emp="'+e.id+'">Ver perfil</button>')+
          '</div></td></tr>';
      });
    }
    html += '</tbody></table></div>';
    html += '<div class="table-foot"><span>'+(filtered.length===0?0:teamPage*TEAM_PAGE_SIZE+1)+'–'+Math.min(filtered.length, teamPage*TEAM_PAGE_SIZE+TEAM_PAGE_SIZE)+' de '+filtered.length+' colaboradores</span>'+
      '<div class="pager"><button class="icon-btn" id="team-prev" '+(teamPage<=0?'disabled':'')+'>‹</button><span>'+(teamPage+1)+' / '+totalPages+'</span><button class="icon-btn" id="team-next" '+(teamPage>=totalPages-1?'disabled':'')+'>›</button></div></div>';
    html += '</div>';
    return html;
  }

  function balanceCard(person, title){
    var b = person.balances;
    var vUsed=b.ferias.aprovado, vPending=b.ferias.pendente, vTotal=person.vacationDaysTotal, vRemain=vTotal-vUsed;
    var sUsed=b.baixa.aprovado, sPending=b.baixa.pendente, sTotal=person.sickDaysTotal, sRemain=sTotal-sUsed;
    var vPct = vTotal>0 ? (vUsed/vTotal*100) : 0;
    var sPct = sTotal>0 ? (sUsed/sTotal*100) : 0;
    return '<div class="panel"><div class="panel-head"><h3>'+(title||'Saldo')+'</h3></div><div class="balance-card">'+

      '<div class="balance-figure '+(vRemain<0?'low':'')+'"'+(vRemain<0?' style="color:var(--rose)"':'')+'>'+vRemain+'<small>restam</small></div></div>'+
      '<div class="balance-row"><div style="display:flex;align-items:center;gap:14px;">'+ringSvg(sPct,'moss')+'<div><div class="balance-title">Baixas</div><div class="balance-sub">'+sUsed+' de '+sTotal+' dias usados</div>'+(sPending>0?'<div class="pending-note">+'+sPending+' pendente'+(sPending!==1?'s':'')+' de aprovação</div>':'')+'</div></div>'+
      '<div class="balance-figure"'+(sRemain<0?' style="color:var(--rose)"':'')+'>'+sRemain+'<small>restam</small></div></div>'+
      '<div class="balance-row"><div><div class="balance-title">Antiguidade</div><div class="balance-sub">desde '+fmt(person.startDate)+'</div></div><div class="balance-figure">'+yearsOfService(person.startDate)+'<small>anos</small></div></div>'+
      '</div></div>';
  }
  function yearsOfService(startIso){
    var s=parseIso(startIso), n=new Date();
    var y=n.getFullYear()-s.getFullYear();
    if(n.getMonth()<s.getMonth() || (n.getMonth()===s.getMonth() && n.getDate()<s.getDate())) y--;
    return Math.max(0,y);
  }

  function render(){
    var me = currentUser();
    if(!me) return;
    var pendingCount = me.role==='gestor' ? state.leaves.filter(function(l){return l.status==='pendente';}).length : 0;
    var vRemain = me.vacationDaysTotal - me.balances.ferias.aprovado;
    if(me.photo){
      document.getElementById('drawer-avatar').innerHTML = '<img src="'+esc(me.photo)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
      document.getElementById('topbar-avatar').innerHTML = '<img src="'+esc(me.photo)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
    } else {
      document.getElementById('drawer-avatar').textContent = initials(me.name);
      document.getElementById('topbar-avatar').textContent = initials(me.name);
    }
    document.getElementById('drawer-name').textContent = me.name;
    document.getElementById('drawer-role').textContent = me.role==='gestor' ? 'Gestor' : 'Colaborador';
    document.getElementById('drawer-balance').textContent = vRemain+' dias restantes';

    var gestorViews = {team:1, pending:1, teamcal:1, reports:1, empDetail:1, pipeline:1};
    if(gestorViews[currentView] && me.role!=='gestor') currentView='home';

    renderDrawerBody(me, pendingCount);
    renderMain();
  }

  function renderDrawerBody(me, pendingCount){
    var body = document.getElementById('drawer-body');
    var html = '';
    NAV_STRUCTURE.forEach(function(sec){
      if(sec.gestorOnly && me.role!=='gestor') return;
      html += '<div class="drawer-section'+(sec.rh?' rh':'')+'"><div class="drawer-section-label">'+esc(sec.section)+(sec.rh?' <span class="rh-badge">RH</span>':'')+'</div>';
      sec.items.forEach(function(it){
        var active = it.key && it.key===currentView;
        var badge = (it.badge && pendingCount>0) ? '<span class="item-badge">'+pendingCount+'</span>' : '';
        html += '<button type="button" class="drawer-item'+(active?' active':'')+'" data-nav="'+(it.key||'')+'" data-action="'+(it.action||'')+'">'+icon(it.icon)+'<span>'+esc(it.label)+'</span>'+badge+'</button>';
      });
      html += '</div>';
    });
    body.innerHTML = html;
    body.querySelectorAll('[data-nav], [data-action]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var action = btn.getAttribute('data-action');
        var key = btn.getAttribute('data-nav');
        closeDrawer();
        if(action==='mark'){ openLeaveModal(state.me.id, state.me.name); return; }
        currentView = key;
        render();
      });
    });
  }

  function renderMain(){
    var me = currentUser();

    if(currentView==='team'){ main.innerHTML = viewTeam(); wireTeam(); return; }
    if(currentView==='empDetail'){ main.innerHTML = viewEmployeeDetail(); wireEmployeeDetail(); return; }
    if(currentView==='mine'){ main.innerHTML = viewMine(); wirePersonal(); return; }
    if(currentView==='pending'){ main.innerHTML = viewPendingApprovals(); wirePendingApprovals(); return; }
    if(currentView==='teamcal'){ main.innerHTML = viewTeamCalendar(); wireTeamCalendar(); return; }
    if(currentView==='pipeline'){ main.innerHTML = viewPipeline(); wirePipeline(); return; }
    if(currentView==='reports'){ main.innerHTML = viewReports(); wireReports(); return; }
    if(currentView==='settings'){ main.innerHTML = viewSettings(); return; }
    if(currentView==='help'){ main.innerHTML = viewHelp(); return; }
    if(currentView==='justificativos'){ main.innerHTML = viewJustificativos(); return; }
    main.innerHTML = viewHome(); wireHome();
  }

  function kanbanCard(l){
    var actions = '';
    if(l.status==='pendente'){
      actions = '<button class="btn btn-sm btn-reject" data-pipe="'+l.id+'" data-to="rejeitado">Rejeitar</button><button class="btn btn-sm btn-approve" data-pipe="'+l.id+'" data-to="aprovado">Aprovar</button>';
    } else if(l.status==='aprovado'){
      actions = '<button class="btn btn-ghost btn-sm" data-pipe="'+l.id+'" data-to="pendente">‹ Reverter</button><button class="btn btn-sm btn-reject" data-pipe="'+l.id+'" data-to="rejeitado">Rejeitar</button>';
    } else {
      actions = '<button class="btn btn-ghost btn-sm" data-pipe="'+l.id+'" data-to="pendente">‹ Reverter</button><button class="btn btn-sm btn-approve" data-pipe="'+l.id+'" data-to="aprovado">Aprovar</button>';
    }

      (l.respondedByName ? '<div class="status-detail" style="margin-top:8px;">por '+esc(l.respondedByName)+'</div>' : '')+
      '<div class="kanban-card-actions">'+actions+'</div></div>';

  function viewPipeline(){
    var cols = [
      {status:'pendente', title:'Pendente'},
      {status:'aprovado', title:'Aprovado'},
      {status:'rejeitado', title:'Rejeitado'}
    ];
    var html = '<div class="page-head"><div><h2>Pipeline de Pedidos</h2><p>Acompanha os pedidos de férias e baixa por fase.</p></div></div>';

  function dayOfMonth(iso){ return parseInt(iso.slice(8,10),10); }
  function clampToMonth(iso, y, m){
    var lo = isoFromYMD(y,m,1), hi = isoFromYMD(y,m,new Date(y,m+1,0).getDate());
    return iso<lo ? lo : (iso>hi ? hi : iso);
  }

  function viewTeamCalendar(){
    var y=wcYear, m=wcMonth;
    var daysInMonth = new Date(y,m+1,0).getDate();
    var todayStr = todayIso();

    var html = '<div class="page-head"><div><h2>Calendário da Equipa</h2><p>Vista horizontal para controlo de sobreposição de ausências.</p></div>'+
      '<button class="btn btn-primary" id="wc-mark">+ Marcar ausência</button></div>';

    html += '<div class="panel"><div class="panel-head"><h3>'+MONTH_NAMES[m]+' '+y+'</h3><div class="cal-nav"><button type="button" id="wc-prev">‹</button><button type="button" id="wc-next">›</button></div></div>';
    html += '<div class="wallchart-scroll"><div class="wallchart">';

    var colStyle = 'grid-template-columns:repeat('+daysInMonth+',minmax(28px,1fr));';

    html += '<div class="wallchart-row wallchart-head"><div class="wallchart-namecol"></div><div class="wallchart-days" style="'+colStyle+'">';
    for(var d=1; d<=daysInMonth; d++){
      var iso = isoFromYMD(y,m,d);
      var dow = new Date(y,m,d).getDay();
      var weekend = (dow===0 || dow===6);
      html += '<div class="wallchart-daylabel'+(weekend?' weekend':'')+'" style="grid-column:'+d+';"><span class="dow">'+DOW_NAMES[(dow+6)%7]+'</span>'+d+'</div>';
    }
    html += '</div></div>';

    state.employees.forEach(function(e){
      html += '<div class="wallchart-row"><div class="wallchart-namecol">'+
        avatarHtml(e)+'<div><div class="li-name">'+esc(e.name)+'</div><div class="li-sub">'+esc(e.jobTitle||(e.role==='gestor'?'Gestor':'Colaborador'))+'</div></div>'+
        '<button class="icon-btn" title="Marcar ausência" data-mark="'+e.id+'" data-name="'+esc(e.name)+'" style="margin-left:auto;">🗓️</button>'+
        '</div><div class="wallchart-days" style="'+colStyle+'">';
      for(var d2=1; d2<=daysInMonth; d2++){
        var iso2 = isoFromYMD(y,m,d2);
        var dow2 = new Date(y,m,d2).getDay();
        var weekend2 = (dow2===0 || dow2===6);
        var cls = 'wallchart-cell'+(weekend2?' weekend':'')+(iso2===todayStr?' today':'');
        html += '<div class="'+cls+'" style="grid-column:'+d2+';">'+d2+'</div>';
      }
      var empLeaves = state.leaves.filter(function(l){
        return l.employeeId===e.id && l.status!=='rejeitado' && l.start<=isoFromYMD(y,m,daysInMonth) && l.end>=isoFromYMD(y,m,1);
      });
      empLeaves.forEach(function(l){
        var s = dayOfMonth(clampToMonth(l.start,y,m));
        var en = dayOfMonth(clampToMonth(l.end,y,m));
        html += '<div class="wallchart-bar '+(l.status==='pendente'?'pendente':l.type)+'" style="grid-column:'+s+' / '+(en+1)+';" title="'+esc(l.employeeName)+' · '+chipLabel(l.type)+' · '+fmt(l.start)+' – '+fmt(l.end)+'">'+chipLabel(l.type)+'</div>';
      });
      html += '</div></div>';
    });

    html += '</div></div>';
    html += '<div class="wallchart-legend"><span><span class="cal-dot" style="background:var(--accent)"></span>Férias</span><span><span class="cal-dot" style="background:var(--moss)"></span>Baixa</span><span><span class="cal-dot" style="background:var(--pending)"></span>Pendente</span></div>';
    html += '</div>';
    return html;
  }
  function wireTeamCalendar(){
    var prev = document.getElementById('wc-prev'), next = document.getElementById('wc-next');
    if(prev) prev.addEventListener('click', function(){ wcMonth--; if(wcMonth<0){wcMonth=11;wcYear--;} renderMain(); });
    if(next) next.addEventListener('click', function(){ wcMonth++; if(wcMonth>11){wcMonth=0;wcYear++;} renderMain(); });

    if(markBtn) markBtn.addEventListener('click', function(){ openLeaveModal(state.me.id, state.me.name); });
    document.querySelectorAll('[data-mark]').forEach(function(btn){
      btn.addEventListener('click', function(){ openLeaveModal(btn.getAttribute('data-mark'), btn.getAttribute('data-name')); });
    });
  }

  function viewReports(){
    var year = new Date().getFullYear();
    var approved = state.leaves.filter(function(l){return l.status==='aprovado';});

      '<div class="stat-card"><div class="stat-num">'+daysBaixa+'</div><div class="stat-label">Dias de baixa usados</div></div>'+

    var rows = [['Colaborador','Tipo','Início','Fim','Dias','Estado']];
    state.leaves.slice().sort(function(a,b){return a.start<b.start?-1:1;}).forEach(function(l){
      rows.push([l.employeeName, chipLabel(l.type), l.start, l.end, l.days, l.status]);
    });
    var csv = rows.map(function(r){
      return r.map(function(v){ v=String(v==null?'':v); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';');
    }).join('\r\n');
    var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'mapa-de-ferias-'+todayIso()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

    html += '<div class="panel"><div class="panel-head"><h3>'+filtered.length+' colaborador'+(filtered.length!==1?'es':'')+'</h3>'+
      '<div class="search-input-wrap">'+icon('search')+'<input type="text" id="team-list-search" placeholder="Pesquisar por nome, cargo ou tag…" value="'+esc(teamListSearch)+'"></div>'+
      '</div><div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Início</th><th>Estado</th><th>Férias</th><th>Baixas</th><th></th></tr></thead><tbody>';
    if(pageRows.length===0){
      html += '<tr><td colspan="6"><div class="empty">Nenhum colaborador encontrado.</div></td></tr>';
    } else {
      pageRows.forEach(function(e){
        var b = e.balances;
        var vRemain = e.vacationDaysTotal - b.ferias.aprovado, sRemain = e.sickDaysTotal - b.baixa.aprovado;
        html += '<tr><td><div class="list-item-main">'+avatarHtml(e)+'<div><div class="li-name">'+esc(e.name)+'</div><div class="li-sub">'+esc(e.jobTitle||(e.role==='gestor'?'Gestor':'Colaborador'))+'</div>'+tagRow(e.tags)+'</div></div></td>'+
          '<td class="mono">'+fmt(e.startDate)+'</td>'+
          '<td>'+employeeStatusBadge(e)+'</td>'+
          '<td class="bal">'+b.ferias.aprovado+'/'+e.vacationDaysTotal+' <span class="'+(vRemain<0?'low':'')+'">('+vRemain+' restam)</span>'+(b.ferias.pendente>0?'<div class="pending-note">+'+b.ferias.pendente+' pend.</div>':'')+'</td>'+
          '<td class="bal">'+b.baixa.aprovado+'/'+e.sickDaysTotal+' <span class="'+(sRemain<0?'low':'')+'">('+sRemain+' restam)</span>'+(b.baixa.pendente>0?'<div class="pending-note">+'+b.baixa.pendente+' pend.</div>':'')+'</td>'+
          '<td><div class="row-actions">'+
            '<button class="icon-btn" title="Ver perfil" data-view-emp="'+e.id+'">👁</button>'+
            '<button class="icon-btn" title="Marcar ausência" data-mark="'+e.id+'" data-name="'+esc(e.name)+'">🗓️</button>'+
            '<button class="icon-btn" title="Editar" data-edit="'+e.id+'">✎</button>'+
            '<button class="icon-btn" title="Remover" data-remove="'+e.id+'">🗑</button>'+
          '</div></td></tr>';
      });
    }
    html += '</tbody></table></div>';
    html += '<div class="table-foot"><span>'+(filtered.length===0?0:teamListPage*pageSize+1)+'–'+Math.min(filtered.length, teamListPage*pageSize+pageSize)+' de '+filtered.length+' colaboradores</span>'+
      '<div class="pager"><button class="icon-btn" id="team-list-prev" '+(teamListPage<=0?'disabled':'')+'>‹</button><span>'+(teamListPage+1)+' / '+totalPages+'</span><button class="icon-btn" id="team-list-next" '+(teamListPage>=totalPages-1?'disabled':'')+'>›</button></div></div>';
    html += '</div>';
    return html;
  }

  function wireTeam(){
    var add = document.getElementById('add-emp');
    if(add) add.addEventListener('click', function(){ openEmployeeModal(null); });
    var searchInput = document.getElementById('team-list-search');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        teamListSearch = searchInput.value; teamListPage = 0; renderMain();
        var el = document.getElementById('team-list-search');
        if(el){ el.focus(); var v=el.value; el.value=''; el.value=v; }
      });
    }
    var prevBtn = document.getElementById('team-list-prev'), nextBtn = document.getElementById('team-list-next');
    if(prevBtn) prevBtn.addEventListener('click', function(){ teamListPage--; renderMain(); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ teamListPage++; renderMain(); });
    document.querySelectorAll('[data-tagf]').forEach(function(btn){
      btn.addEventListener('click', function(){ teamListTagFilter = btn.getAttribute('data-tagf'); teamListPage = 0; renderMain(); });
    });
    document.querySelectorAll('[data-view-emp]').forEach(function(btn){
      btn.addEventListener('click', function(){ openEmployeeDetail(btn.getAttribute('data-view-emp')); });
    });
    document.querySelectorAll('[data-mark]').forEach(function(btn){
      btn.addEventListener('click', function(){ openLeaveModal(btn.getAttribute('data-mark'), btn.getAttribute('data-name')); });
    });
    document.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var emp = state.employees.find(function(e){return e.id===btn.getAttribute('data-edit');});
        openEmployeeModal(emp);
      });
    });
    document.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-remove');
        var emp = state.employees.find(function(e){return e.id===id;});
        if(!confirm('Remover '+emp.name+' e todo o seu histórico?')) return;
        try{ await api('employees/'+id, {method:'DELETE'}); await loadState(); }
        catch(e){ showToast(e.message); }
      });
    });
  }

  function openModal(innerHtml){
    var wrap = document.createElement('div');
    wrap.className='modal-backdrop'; wrap.id='modal-backdrop';
    wrap.innerHTML = '<div class="modal">'+innerHtml+'</div>';
    wrap.addEventListener('mousedown', function(ev){ if(ev.target===wrap) closeModal(); });
    document.body.appendChild(wrap);
    return wrap;
  }
  function closeModal(){ var m=document.getElementById('modal-backdrop'); if(m) m.remove(); }

  function openContactModal(){
    var me = state.me;
    var m = openModal(
      '<h3>Editar contacto</h3><p class="modal-sub">'+esc(me.name)+'</p>'+
      '<div class="field"><label>Email</label><input id="f-email" type="email" value="'+esc(me.email||'')+'"></div>'+
      '<div class="field"><label>Telefone (WhatsApp)</label><input id="f-phone" value="'+esc(me.phone||'')+'"></div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" id="c-cancel">Cancelar</button><button class="btn btn-primary" id="c-save">Guardar</button></div>'
    );
    m.querySelector('#c-cancel').addEventListener('click', closeModal);
    m.querySelector('#c-save').addEventListener('click', async function(){
      try{
        await api('me/contact', {method:'PUT', body: JSON.stringify({
          email: document.getElementById('f-email').value.trim(),
          phone: document.getElementById('f-phone').value.trim()
        })});
        closeModal(); await loadState();
      }catch(e){ showToast(e.message); }
    });
  }

  function openEmployeeModal(emp){
    var isNew = !emp;
    var e = emp || { id:null, name:'', startDate: todayIso(), email:'', phone:'', username:'', role:'colaborador', vacationDaysTotal:22, sickDaysTotal:3, jobTitle:'', contractType:'efetivo', contractEnd:'', tags:[] };
    var contractOptions = CONTRACT_TYPES.map(function(c){ return '<option value="'+c.value+'"'+(e.contractType===c.value?' selected':'')+'>'+c.label+'</option>'; }).join('');
    var m = openModal(
      '<h3>'+(isNew?'Novo colaborador':'Editar colaborador')+'</h3><p class="modal-sub">Preenche os dados, o contrato e o acesso de login.</p>'+
      '<div class="form-error" id="emp-err"></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Nome</label><input id="f-name" value="'+esc(e.name)+'"></div>'+
        '<div class="field"><label>Cargo / Designação</label><input id="f-job" placeholder="ex: Designer de UX" value="'+esc(e.jobTitle||'')+'"></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Data de início</label><input id="f-start" type="date" value="'+e.startDate+'"></div>'+
        '<div class="field"><label>Função</label><select id="f-role"><option value="colaborador"'+(e.role==='colaborador'?' selected':'')+'>Colaborador</option><option value="gestor"'+(e.role==='gestor'?' selected':'')+'>Gestor</option></select></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Tipo de contrato</label><select id="f-contract-type">'+contractOptions+'</select></div>'+
        '<div class="field" id="f-contract-end-wrap"><label>Fim do contrato</label><input id="f-contract-end" type="date" value="'+(e.contractEnd||'')+'"></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Email</label><input id="f-email" type="email" value="'+esc(e.email||'')+'"></div>'+
        '<div class="field"><label>Telefone (WhatsApp)</label><input id="f-phone" value="'+esc(e.phone||'')+'"></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Dias de férias / ano</label><input id="f-vac" type="number" min="0" value="'+e.vacationDaysTotal+'"></div>'+
        '<div class="field"><label>Dias de baixa / ano</label><input id="f-sick" type="number" min="0" value="'+e.sickDaysTotal+'"></div>'+
      '</div>'+
      '<div class="field"><label>Tags</label><input id="f-tags" placeholder="ex: Designer, R&D, Evento X" value="'+esc((e.tags||[]).join(', '))+'"><div class="form-note">Separadas por vírgula.</div></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Utilizador</label><input id="f-user" value="'+esc(e.username)+'"></div>'+
        '<div class="field"><label>'+(isNew?'Palavra-passe':'Nova palavra-passe (opcional)')+'</label><input id="f-pass" value=""></div>'+
      '</div>'+
      '<div class="form-note">As passwords ficam encriptadas no servidor — nunca são devolvidas ao browser.</div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" id="e-cancel">Cancelar</button><button class="btn btn-primary" id="e-save">Guardar</button></div>'
    );
    function syncContractEndVisibility(){
      var wrap = document.getElementById('f-contract-end-wrap');
      wrap.style.display = document.getElementById('f-contract-type').value==='efetivo' ? 'none' : '';
    }
    m.querySelector('#f-contract-type').addEventListener('change', syncContractEndVisibility);
    syncContractEndVisibility();
    m.querySelector('#e-cancel').addEventListener('click', closeModal);
    m.querySelector('#e-save').addEventListener('click', async function(){
      var name = document.getElementById('f-name').value.trim();
      var username = document.getElementById('f-user').value.trim();
      var password = document.getElementById('f-pass').value;
      var errEl = document.getElementById('emp-err');
      if(!name || !username || (isNew && !password)){
        errEl.textContent = 'Preenche nome, utilizador e palavra-passe.'; errEl.style.display='block'; return;
      }
      var payload = {
        name: name, username: username,
        startDate: document.getElementById('f-start').value || todayIso(),
        role: document.getElementById('f-role').value,
        email: document.getElementById('f-email').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        vacationDaysTotal: parseInt(document.getElementById('f-vac').value,10) || 0,
        sickDaysTotal: parseInt(document.getElementById('f-sick').value,10) || 0,
        jobTitle: document.getElementById('f-job').value.trim(),
        tags: document.getElementById('f-tags').value.split(',').map(function(t){return t.trim();}).filter(Boolean),
        contractType: document.getElementById('f-contract-type').value,
        contractEnd: document.getElementById('f-contract-type').value==='efetivo' ? null : (document.getElementById('f-contract-end').value || null),
      };
      if(password) payload.password = password;
      try{
        if(isNew) await api('employees', {method:'POST', body: JSON.stringify(payload)});
        else await api('employees/'+e.id, {method:'PUT', body: JSON.stringify(payload)});
        closeModal(); await loadState();
      }catch(err){ errEl.textContent = err.message; errEl.style.display='block'; }
    });
  }

  function openActivityModal(empId){
    var typeOptions = Object.keys(ACTIVITY_TYPE_LABELS).map(function(k){ return '<option value="'+k+'">'+ACTIVITY_TYPE_LABELS[k]+'</option>'; }).join('');
    var statusOptions = Object.keys(ACTIVITY_STATUS_LABELS).map(function(k){ return '<option value="'+k+'">'+ACTIVITY_STATUS_LABELS[k]+'</option>'; }).join('');
    var impactOptions = '<option value="">—</option>'+Object.keys(ACTIVITY_IMPACT_LABELS).map(function(k){ return '<option value="'+k+'">'+ACTIVITY_IMPACT_LABELS[k]+'</option>'; }).join('');
    var m = openModal(
      '<h3>Registar interação</h3><p class="modal-sub">O que aconteceu, quando e como correu.</p>'+
      '<div class="form-error" id="act-err"></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Tipo</label><select id="f-act-type">'+typeOptions+'</select></div>'+
        '<div class="field"><label>Estado</label><select id="f-act-status">'+statusOptions+'</select></div>'+
      '</div>'+
      '<div class="field"><label>Detalhes</label><textarea id="f-act-details" rows="4" placeholder="O que foi falado ou combinado…" style="width:100%;border:1px solid var(--sand);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:13.5px;resize:vertical;"></textarea></div>'+
      '<div class="field"><label>Impacto (opcional)</label><select id="f-act-impact">'+impactOptions+'</select></div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" id="act-cancel">Cancelar</button><button class="btn btn-primary" id="act-save">Guardar</button></div>'
    );
    m.querySelector('#act-cancel').addEventListener('click', closeModal);
    m.querySelector('#act-save').addEventListener('click', async function(){
      var details = document.getElementById('f-act-details').value.trim();
      var errEl = document.getElementById('act-err');
      if(!details){ errEl.textContent='Descreve o que aconteceu.'; errEl.style.display='block'; return; }
      try{
        await api('employees/'+empId+'/activities', {method:'POST', body: JSON.stringify({
          type: document.getElementById('f-act-type').value,
          status: document.getElementById('f-act-status').value,
          impact: document.getElementById('f-act-impact').value,
          details: details
        })});
        closeModal();
        await loadEmployeeActivities(empId);
        showToast('Interação registada.');
      }catch(e){ errEl.textContent = e.message; errEl.style.display='block'; }
    });
  }

  function openLeaveModal(employeeId, employeeName){
    var type = 'ferias';
    var m = openModal(
      '<h3>Marcar ausência</h3><p class="modal-sub">'+esc(employeeName)+'</p>'+
      '<div class="form-error" id="lv-err"></div>'+
      '<div class="segment"><button type="button" class="active" id="seg-ferias">Férias</button><button type="button" id="seg-baixa">Baixa</button></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Início</label><input id="f-lstart" type="date" value="'+todayIso()+'"></div>'+
        '<div class="field"><label>Fim</label><input id="f-lend" type="date" value="'+todayIso()+'"></div>'+
      '</div>'+
      '<div class="form-note" id="lv-preview"></div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" id="l-cancel">Cancelar</button><button class="btn btn-primary" id="l-save">Marcar</button></div>'
    );
    var isAuto = state.me.role==='gestor';
    function updatePreview(){
      var s=document.getElementById('f-lstart').value, en=document.getElementById('f-lend').value;
      var el=document.getElementById('lv-preview');
      if(!s || !en || parseIso(en)<parseIso(s)){ el.textContent='Escolhe um intervalo de datas válido.'; return; }
      var days = type==='ferias' ? businessDaysCount(s,en) : calendarDaysCount(s,en);
      el.textContent = days+' dia'+(days!==1?'s':'')+(type==='ferias'?' úteis':'')+(isAuto?'':' · fica pendente de aprovação');
    }
    m.querySelector('#seg-ferias').addEventListener('click', function(){ type='ferias'; this.classList.add('active'); m.querySelector('#seg-baixa').classList.remove('active'); updatePreview(); });
    m.querySelector('#seg-baixa').addEventListener('click', function(){ type='baixa'; this.classList.add('active','baixa'); m.querySelector('#seg-ferias').classList.remove('active'); updatePreview(); });
    m.querySelector('#f-lstart').addEventListener('input', updatePreview);
    m.querySelector('#f-lend').addEventListener('input', updatePreview);
    updatePreview();
    m.querySelector('#l-cancel').addEventListener('click', closeModal);
    m.querySelector('#l-save').addEventListener('click', async function(){
      var s=document.getElementById('f-lstart').value, en=document.getElementById('f-lend').value;
      var errEl=document.getElementById('lv-err');
      try{
        var res = await api('leaves', {method:'POST', body: JSON.stringify({employeeId:employeeId, type:type, start:s, end:en})});
        closeModal(); await loadState();
        showToast(res.status==='aprovado' ? (type==='ferias'?'Férias marcadas.':'Baixa registada.') : 'Pedido enviado — fica pendente até o administrador aprovar.');
      }catch(err){ errEl.textContent = err.message; errEl.style.display='block'; }
    });
  }

  // ---------------- Auth ----------------
  document.getElementById('login-form').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var u = document.getElementById('login-user').value.trim();
    var p = document.getElementById('login-pass').value;
    var errEl = document.getElementById('login-error');
    errEl.style.display='none';
    try{
      await api('login', {method:'POST', body: JSON.stringify({username:u, password:p})});
      document.getElementById('login-pass').value='';
      currentView='home';
      await enterApp();
    }catch(e){ errEl.textContent = e.message; errEl.style.display='block'; }
  });

  document.getElementById('logout-btn').addEventListener('click', async function(){
    try{ await api('logout', {method:'POST'}); }catch(e){}
    state = null;
    document.getElementById('app-view').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
  });

  document.getElementById('hamburger-btn').innerHTML = icon('menu');
  document.getElementById('drawer-close').innerHTML = icon('x');
  document.getElementById('hamburger-btn').addEventListener('click', openDrawer);
  document.getElementById('topbar-avatar').addEventListener('click', openDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && drawerOpen) closeDrawer(); });

  async function enterApp(){
    await loadState();
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
  }

  (async function boot(){
    try{
      state = await api('state');
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      render();
    }catch(e){
      // not logged in, show login screen (default state)
    }
  })();
})();
</script>
</body>
</html>
